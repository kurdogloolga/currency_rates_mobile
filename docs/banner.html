<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(125deg, #0F2459 0%, #1C3D8C 48%, #3F51D9 100%);
    color: #fff; position: relative;
  }
  .bubble { position: absolute; border-radius: 50%; background: rgba(255,255,255,.07); }
  .b1 { width: 520px; height: 520px; right: -140px; top: -180px; }
  .b2 { width: 260px; height: 260px; left: -90px; bottom: -110px; background: rgba(255,255,255,.05); }
  .b3 { width: 90px; height: 90px; left: 540px; top: 70px; }
  .gold-dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #F2B705; left: 72px; top: 64px; }
  .text { position: absolute; left: 72px; top: 110px; width: 560px; }
  .eyebrow { color: #F2B705; font-weight: 800; letter-spacing: 6px; font-size: 18px; }
  h1 { font-size: 76px; font-weight: 800; letter-spacing: -2px; line-height: 1.02; margin-top: 14px; }
  .sub { font-size: 24px; color: rgba(255,255,255,.80); margin-top: 18px; line-height: 1.4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; width: 600px; }
  .chip { padding: 8px 13px; border-radius: 40px; background: rgba(255,255,255,.13); font-size: 15px; font-weight: 600; }
  .chip.gold { background: #F2B705; color: #2B1F00; }
  .phones { position: absolute; right: 40px; top: 46px; width: 600px; height: 600px; }
  .phone {
    position: absolute; width: 236px; border-radius: 30px; padding: 8px;
    background: #0b1020; box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.12) inset;
  }
  .phone img { width: 100%; display: block; border-radius: 23px; }
  .p1 { left: 0; top: 70px; transform: rotate(-7deg); }
  .p2 { left: 182px; top: 0; z-index: 2; }
  .p3 { left: 364px; top: 70px; transform: rotate(7deg); }
</style>
</head>
<body>
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
  <div class="gold-dot"></div>
  <div class="text">
    <div class="eyebrow">ЛАБОРАТОРНАЯ РАБОТА №4</div>
    <h1>Курсы НБМ</h1>
    <div class="sub">Конвертер валют и аналитика курса<br>за неделю и месяц — даже без интернета</div>
    <div class="chips">
      <span class="chip gold">Flutter · Dart</span>
      <span class="chip">Android</span>
      <span class="chip">40 валют</span>
      <span class="chip">Офлайн-кэш</span>
      <span class="chip">79 тестов</span>
    </div>
  </div>
  <div class="phones">
    <div class="phone p1"><img src="screenshots/converter.png"></div>
    <div class="phone p2"><img src="screenshots/week.png"></div>
    <div class="phone p3"><img src="screenshots/dark.png"></div>
  </div>
</body>
</html>
